linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - shadow
    # CGO-dependent imports fail in typecheck without proper environment setup
    - text: "undefined: sqlite3|undefined: cron|could not import"
      linters:
        - typecheck
